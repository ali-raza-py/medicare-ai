# Render blueprint for the MediCare AI FastAPI backend.
# Deploy via: Render dashboard -> New + -> Blueprint -> select this repo.
# Secrets (MEDICARE_JWT_SECRET, MEDICARE_AI_API_KEY, SUPABASE_SERVICE_ROLE_KEY)
# must be added manually in the Render service environment settings — never commit them.
#
# After deployment, set NEXT_PUBLIC_API_BASE_URL in the Vercel dashboard to the
# Render service URL (e.g. https://medicare-ai-backend.onrender.com) so the
# Vercel-hosted frontend calls Render instead of the Vercel serverless function.
services:
  - type: web
    name: medicare-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: MEDICARE_ENV
        value: production
      # Allow only deployed frontend origins. Add preview domains explicitly when
      # they are needed; production must never accept localhost origins.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://medicare-ai.vercel.app,https://medicare-ai-sigma.vercel.app,https://medicare-ai-ali-raza4.vercel.app"
      - key: MEDICARE_UPLOAD_DIR
        value: /tmp/uploads
      # Image and scanned-PDF uploads require the real PaddleOCR backend.
      - key: MEDICARE_PADDLEOCR_ENABLED
        value: "true"
      - key: MEDICARE_AI_PROVIDER
        value: groq
      - key: MEDICARE_AI_MODEL
        value: openai/gpt-oss-20b
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://fftwxbmoacdxcquowqzv.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MEDICARE_JWT_SECRET
        sync: false
      - key: MEDICARE_AI_API_KEY
        sync: false
